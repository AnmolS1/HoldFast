# clamd for the Holdfast scanner (T20). Decided values; see the Dockerfile header for why.
Foreground yes
LogTime yes
# Not under /run: the Containers runtime mounts a fresh /run at boot (root-owned), so a directory the
# image made there is gone and clamd, running as clamav, cannot recreate it (dev, 2026-10-21).
LocalSocket /scanner-run/clamd.sock
LocalSocketMode 660
DatabaseDirectory /var/lib/clamav
# INSTREAM spools the whole stream here before scanning: on the instance disk, never a tmpfs.
TemporaryDirectory /scan-tmp
# M = 2^20: both are 2,097,152,000 bytes, above the 2,000,000,000 product cap (the shim enforces the cap).
StreamMaxLength 2000M
MaxFileSize 2000M
# Sized to the disk (Addendum 3): standard-1 spool capacity 7,070 MiB = 7,413,170,176 bytes free (spike S2,
# measured with a 306 MB image) − 2,000,000,000 (a cap-sized spool) − 268,435,456 (256 MiB headroom)
# = 5,144,734,720 → rounded down to 4900M = 5,138,022,400 bytes. Past it: Heuristics.Limits.Exceeded.MaxScanSize.
MaxScanSize 4900M
MaxScanTime 600000
MaxRecursion 16
MaxFiles 10000
MaxEmbeddedPE 40M
MaxHTMLNormalize 40M
MaxScriptNormalize 20M
MaxZipTypeRcg 1M
AlertExceedsMax yes
AlertEncryptedArchive yes
AlertEncryptedDoc yes
# Off: clamd reports one name, and a PUA match can replace an encrypted / limits alert (review B1).
DetectPUA no
ConcurrentDatabaseReload no
# One large scan + four small ones (the shim's slots), the shim's monitor and a RELOAD.
MaxThreads 8
ReadTimeout 900
CommandReadTimeout 900
