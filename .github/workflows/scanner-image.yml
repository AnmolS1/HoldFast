# Rebuilds the PRODUCTION scanner (ClamAV) image and redeploys, so the virus signatures baked into
# the image are never more than about a week old even when containers/ is untouched.
#
# `schedule` and `workflow_dispatch` only fire from the default branch (`prod`), so this does
# nothing until the file is on `prod` (after the beta gate) — until then NOTHING scheduled rebuilds
# any image. While containers/clamav/Dockerfile is still the placeholder (no scanner in it) the
# weekly run is a no-op that says so, and a manual run fails: a green run of this workflow always
# means the step "Deploy with a freshly built image" ran.
#
# It redeploys the code that is ALREADY LIVE, with a fresh image, and nothing else: it refuses to
# continue unless the live build stamp is exactly the commit it runs on. It never migrates a
# database and can never ship undeployed code.
#
# PRODUCTION ONLY, on purpose. The deploy token is a secret of the `Production` environment, and
# an environment's secrets may be read only by code from the branch that environment admits
# (`Production` ↔ `prod`, `dev` ↔ `dev`). So this workflow
#   - runs only on `refs/heads/prod` (the job's `if:`; a dispatch from any other ref is skipped,
#     not merely refused by the environment),
#   - checks out, builds and runs ONLY the commit that triggered it — there is no `ref:`, and no
#     input reaches a script or a checkout,
#   - never touches the dev Worker: code from `dev` must not run with production's token, and the
#     `dev` environment does not admit a run from `prod`.
# The dev image is rebuilt by deploy-dev.yml whenever containers/ or the container settings change
# on `dev`. A scheduled refresh for dev cannot live here (a schedule runs the default branch's
# file); whether dev needs one is the scanner task's decision.
name: scanner-image

on:
  schedule:
    # Mondays 05:23 UTC.
    - cron: "23 5 * * 1"
  # No inputs: there is nothing to choose.
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  rebuild:
    if: github.repository == 'AnmolS1/HoldFast' && github.ref == 'refs/heads/prod'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Holds the production deploy token; admits only runs from `prod`. A required reviewer added
    # to this environment also gates the weekly run.
    environment: Production
    # The same group as deploy-prod.yml: never two deploys to production at once.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: "false"
      WORKER: holdfast
      APP_URL: https://holdfast.ponderance.dev
      FILES_URL: https://holdfastusercontent.com
    steps:
      # The commit that triggered the run, and nothing else: no `ref:`.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The placeholder image has no scanner and no signatures: there is nothing to refresh.
      - name: Is there a real scanner image to rebuild?
        id: guard
        run: |
          dockerfile=containers/clamav/Dockerfile
          if [ ! -f "$dockerfile" ]; then
            echo "::error::$dockerfile is missing"
            exit 1
          fi
          if grep -qiE 'freshclam|clamd' "$dockerfile" && ! grep -qi 'placeholder scanner image' "$dockerfile"; then
            echo "real=true" >>"$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            echo "real=false" >>"$GITHUB_OUTPUT"
            echo "::notice::scanner-image: $dockerfile is still the placeholder — nothing was rebuilt"
          else
            # A person asked for a rebuild. Answering green without rebuilding anything would be a lie.
            echo "::error::scanner-image: $dockerfile is still the placeholder — there is no scanner image to rebuild"
            exit 1
          fi

      - name: Set up Node
        if: steps.guard.outputs.real == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        if: steps.guard.outputs.real == 'true'
        run: npm ci

      - name: Resolve the commit to redeploy
        if: steps.guard.outputs.real == 'true'
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"

      # Redeploy only what is already live. If the branch head is not the live commit, a deploy is
      # pending or failed — that is deploy-dev / deploy-prod's business, not this workflow's.
      - name: The branch head is the commit that is live
        if: steps.guard.outputs.real == 'true'
        env:
          SHA: ${{ steps.commit.outputs.sha }}
        run: bash .github/workflows/lib/deploy-lib.sh stamp "$APP_URL" "$SHA" 1 0

      - name: The Worker exists and has its secrets
        if: steps.guard.outputs.real == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash .github/workflows/lib/deploy-lib.sh worker-ready "$WORKER"

      # Not here yet (it arrives with the real scanner image): before the build, restore the
      # signature cache from b/clamav/ in the DEV bucket (holdfast-files-dev — never the production
      # bucket) into containers/clamav/cvd/, refreshing it when it is older than 24 h. The
      # signature CDN rate-limits CI runners.

      # The environment is chosen at BUILD time. The stamp keeps naming this commit and branch.
      - name: Build (production)
        if: steps.guard.outputs.real == 'true'
        env:
          CLOUDFLARE_ENV: production
          HOLDFAST_GIT_SHA: ${{ steps.commit.outputs.sha }}
          HOLDFAST_GIT_BRANCH: prod
        run: npm run build

      - name: The build is a production build
        if: steps.guard.outputs.real == 'true'
        run: bash .github/workflows/lib/deploy-lib.sh built-env production

      # A Dockerfile path always builds and pushes: that is the point of this workflow.
      - name: Deploy with a freshly built image
        if: steps.guard.outputs.real == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env production

      - name: Build stamp is unchanged
        if: steps.guard.outputs.real == 'true'
        env:
          SHA: ${{ steps.commit.outputs.sha }}
        run: bash .github/workflows/lib/deploy-lib.sh stamp "$APP_URL" "$SHA" 6 10

      - name: App and files host answer
        if: steps.guard.outputs.real == 'true'
        run: |
          bash .github/workflows/lib/deploy-lib.sh health "$APP_URL"
          bash .github/workflows/lib/deploy-lib.sh files-host "$FILES_URL/"
